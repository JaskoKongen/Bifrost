name: CI Pipeline

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  # ==========================================
  # 1. .NET Backend CI (Multi-project support)
  # ==========================================
  backend-ci:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Discover and Test .NET Solutions/Projects
        run: |
          # Find alle .sln filer rekursivt (ignorer skjulte mapper)
          mapfile -t SOLUTIONS < <(find . -name "*.sln" -not -path "*/.*/*")

          if [ ${#SOLUTIONS[@]} -gt 0 ]; then
            echo "Fandt ${#SOLUTIONS[@]} .NET solution(s):"
            for sln in "${SOLUTIONS[@]}"; do
              echo "==> Behandler solution: $sln"
              dotnet restore "$sln"
              dotnet format "$sln" --verify-no-changes || echo "Advarsel: Format-tjek fejlede, men blokerer ikke."
              dotnet build "$sln" --configuration Release --no-restore
              dotnet test "$sln" --configuration Release --no-build --verbosity normal
            done
          else
            # Fallback: Hvis der ikke er en .sln endnu, tjek efter individuelle .csproj
            mapfile -t PROJECTS < <(find . -name "*.csproj" -not -path "*/.*/*")
            if [ ${#PROJECTS[@]} -gt 0 ]; then
              echo "Ingen .sln fundet. Behandler ${#PROJECTS[@]} individuelle .csproj projekt(er):"
              for proj in "${PROJECTS[@]}"; do
                echo "==> Behandler projekt: $proj"
                dotnet restore "$proj"
                dotnet build "$proj" --configuration Release --no-restore
                dotnet test "$proj" --configuration Release --no-build --verbosity normal || true
              done
            else
              echo "Ingen .NET solutions eller projekter fundet i repositoriet. Springer over."
            fi
          fi

  # ==========================================
  # 2. Frontend CI (Angular / React / Node)
  # ==========================================
  frontend-ci:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover and Test Frontend Projects
        run: |
          # Find alle mapper der indeholder package.json (ekskluder node_modules og .github)
          mapfile -t PKG_DIRS < <(find . -name "package.json" -not -path "*/node_modules/*" -not -path "*/.github/*" -exec dirname {} \;)

          if [ ${#PKG_DIRS[@]} -gt 0 ]; then
            echo "Fandt ${#PKG_DIRS[@]} Node/Frontend projekt(er):"
            for dir in "${PKG_DIRS[@]}"; do
              echo "==> Behandler frontend i mappen: $dir"
              pushd "$dir" > /dev/null

              # Installer afhængigheder
              if [ -f "package-lock.json" ]; then
                npm ci
              else
                npm install
              fi

              # Kør lint, test og build hvis scripts findes i package.json
              npm run lint --if-present
              npm test --if-present -- --watch=false --browsers=ChromeHeadless
              npm run build --if-present

              popd > /dev/null
            done
          else
            echo "Ingen package.json filer fundet uden for systemmapper. Springer over."
          fi